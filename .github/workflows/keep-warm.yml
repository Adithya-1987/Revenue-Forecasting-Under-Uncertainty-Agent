# Render free tier sleeps after 15 min idle. Ping /health so the API stays awake.
# Every 10 min, not 14: GitHub often starts scheduled runs several minutes late.
name: Keep Render warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -m 90 --retry 3 --retry-delay 10 https://revenue-forecasting-under-uncertainty.onrender.com/health
